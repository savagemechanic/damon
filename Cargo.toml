[package]
name = "damon"
version = "0.2.4"
edition = "2021"
rust-version = "1.89"
description = "A local-first natural-language computer runtime"
license = "MIT"

[dependencies]
getrandom = "0.2.17"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots"] }
