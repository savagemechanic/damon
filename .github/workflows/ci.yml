name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Install Python harness
        run: python -m pip install -e './python[dev]'
      - name: Test Python harness
        run: python -m pytest -q python/tests
      - name: Compile Python harness
        run: python -m compileall -q python/src
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: ./scripts/swift_test.sh
      - name: Build native app
        run: ./scripts/build_release.sh
      - name: Packaged smoke test
        run: ./scripts/smoke_test.sh
